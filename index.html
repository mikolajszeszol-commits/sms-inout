<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Szyfrowany Czat Dark Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-container">
    <!-- Ekran startowy: rejestracja numeru ID -->
    <div id="setup-screen">
        <h2>Witaj w komunikatorze</h2>
        <p>Wprowadź swój numer telefonu lub ID, aby rozpocząć:</p>
        <input type="text" id="myIdInput" placeholder="np. +48123456789">
        <button id="enterChatBtn">Wejdź do czatu</button>
    </div>

    <!-- Ekran właściwego czatu -->
    <div id="chat-screen" style="display: none;">
        <div class="chat-header">
            <span>Czat jako: <strong id="currentIdDisplay"></strong></span>
        </div>
        <div id="chat-box"></div>
        <div class="input-group">
            <input type="text" id="messageInput" placeholder="Napisz wiadomość...">
            <button id="sendBtn">Wyślij</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
