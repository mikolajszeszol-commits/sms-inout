<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Mój Komunikator ID</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-container">
    
    <!-- 1. EKRAN REJESTRACJI -->
    <div id="register-screen">
        <h2>Rejestracja</h2>
        <input type="text" id="regPhone" placeholder="Twój numer telefonu (np. 500600700)">
        <input type="password" id="regPassword" placeholder="Wpisz hasło">
        <button id="registerBtn">Zarejestruj numer</button>
    </div>

    <!-- 2. EKRAN WERYFIKACJI KODEM -->
    <div id="verify-screen" style="display: none;">
        <h2>Weryfikacja</h2>
        <p>Wpisz 2-cyfrowy kod wysłany na Twój numer:</p>
        <div id="codeDisplayBox" style="font-size: 1.5em; color: #00b4d8; font-weight: bold; margin-bottom: 10px;"></div>
        <input type="text" id="verifyInput" placeholder="Kod (2 cyfry)" maxlength="2">
        <button id="verifyBtn">Potwierdź kod</button>
    </div>

    <!-- 3. EKRAN WYBORU ROZMÓWCY (KONTAKTU) -->
    <div id="contact-screen" style="display: none;">
        <h2>Wybierz rozmówcę</h2>
        <p>Zalogowany jako: <strong id="myPhoneDisplay"></strong></p>
        <input type="text" id="targetPhoneInput" placeholder="Numer osoby, do której piszesz">
        <button id="startChatBtn">Rozpocznij czat</button>
    </div>

    <!-- 4. EKRAN WŁAŚCIWEGO CZATU -->
    <div id="chat-screen" style="display: none;">
        <div class="chat-header">
            <span>Rozmowa z: <strong id="targetDisplay"></strong></span>
        </div>
        <div id="chat-box"></div>
        <div class="input-group">
            <input type="text" id="messageInput" placeholder="Napisz wiadomość...">
            <button id="sendBtn">Wyślij</button>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
