<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Prosty Czat na GitHubie</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 500px; }
        #chat-box { flex: 1; border: 1px solid #ddd; border-radius: 4px; padding: 10px; overflow-y: auto; margin-bottom: 10px; background: #fafafa; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; outline: none; }
        button { padding: 10px 20px; background: #0084ff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #006dd1; }
        .msg { margin-bottom: 8px; padding: 6px 10px; border-radius: 4px; background: #e4e6eb; width: fit-content; max-width: 80%; word-break: break-word; }
        .my-msg { background: #dcf8c6; margin-left: auto; }
        .system-msg { color: #888; font-style: italic; font-size: 0.9em; text-align: center; width: 100%; background: none; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>Czat GitHub Pages</h2>
    <div id="chat-box"></div>
    <div class="input-group">
        <input type="text" id="messageInput" placeholder="Napisz wiadomość..." autofocus>
        <button onclick="sendMessage()">Wyślij</button>
    </div>
</div>

<script>
    // Używamy darmowego publicznego kanału testowego WebSocket (Echo / Relay)
    // Uwaga: To ogólnodostępny kanał testowy, więc wiadomości mogą widzieć inni testeri na świecie.
    const ws = new WebSocket('wss://socketsbay.com/wss/v2/1/demo/');
    const chatBox = document.getElementById('chat-box');
    const messageInput = document.getElementById('messageInput');

    ws.onopen = () => {
        appendMessage("Połączono z siecią!", "system-msg");
    };

    ws.onmessage = (event) => {
        // Ignorujemy wiadomości powitalne lub puste
        if (!event.data) return;
        appendMessage("Znajomy: " + event.data, "msg");
    };

    ws.onclose = () => {
        appendMessage("Utracono połączenie.", "system-msg");
    };

    function sendMessage() {
        const text = messageInput.value.trim();
        if (text === "") return;
        
        ws.send(text);
        appendMessage("Ty: " + text, "msg my-msg");
        messageInput.value = "";
    }

    messageInput.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });

    function appendMessage(text, className) {
        const div = document.createElement("div");
        div.className = "msg " + className;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
