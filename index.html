<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Szyfrowany Czat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-container">
    <div id="setup-screen">
        <h3>Podaj swój numer ID / telefon</h3>
        <input type="text" id="myIdInput" placeholder="np. +48123456789">
        <button onclick="startChat()">Wejdź do czatu</button>
    </div>

    <div id="chat-screen" style="display: none;">
        <h2>Czat (<span id="currentIdDisplay"></span>)</h2>
        <div id="chat-box"></div>
        <div class="input-group">
            <input type="text" id="messageInput" placeholder="Napisz wiadomość...">
            <button id="sendBtn">Wyślij</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
